# =================================================================================
# METADATA
#
# This file defines the dependencies and plugins used in the project.
# It's the recommended way to manage versions and dependencies for multi-module projects,
# ensuring consistency and making updates easier.
# For more information, see: https://docs.gradle.org/current/userguide/platforms.html
# =================================================================================

[versions]

# -------------------- Build & Tooling --------------------
agp = "9.2.1"
kotlin = "2.3.21"
googleServices = "4.4.4"
kotlinCompos = "2.3.21" # Note: This is for the kotlin-compose plugin.

# -------------------- AndroidX Core & Lifecycle --------------------
coreKtx = "1.18.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
activityKtx = "1.13.0"
fragmentKtx = "1.8.9"
viewmodelKtx = "2.10.0"
splashscreeen = "1.2.0"
datastore = "1.2.1"
room_version = "2.8.4"
# -------------------- Compose --------------------
composeBom = "2026.05.01"
navigationCompose = "2.9.8"
material3WindowSizeClass = "1.4.0"

# -------------------- Android XML Views --------------------
constraintlayout = "2.2.1"
recyclerview = "1.4.0"
material3Xml = "1.14.0"

# -------------------- Networking --------------------
retrofit = "3.0.0"
convertorGson = "3.0.0"
httpInterceptor = "5.3.2"
gson = "2.14.0"

# -------------------- Image Loading --------------------
coil = "3.4.0"

# -------------------- Dependency Injection --------------------
hilt = "2.59.2"
hiltKsp = "2.3.4"
hilt-navigation-compose = "1.3.0"

# -------------------- Firebase --------------------
firebaseBom = "34.6.0"
firebaseCrashlytics = "3.0.6"

# -------------------- Testing --------------------
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
firebaseAuthKtx = "24.0.1"


[libraries]

# =================================================================================
# ANDROIDX
# =================================================================================

# -------------------- Core & KTX --------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "viewmodelKtx" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activityKtx" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
splash-screen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreeen" }

# -------------------- Compose --------------------
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-window-sizeClass = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "material3WindowSizeClass" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# -------------------- Compose Testing --------------------
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

# -------------------- Android XML Views --------------------
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-xml-material3 = { group = "com.google.android.material", name = "material", version.ref = "material3Xml" }


# =================================================================================
# 3RD PARTY LIBRARIES
# =================================================================================

# -------------------- Dependency Injection (Hilt) --------------------
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# -------------------- Networking (Retrofit, OkHttp, Gson) --------------------
squareup-retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
gsonConvertor = { module = "com.squareup.retrofit2:converter-gson", version.ref = "convertorGson" }
http-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "httpInterceptor" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# -------------------- Image Loading (Coil) --------------------
coil = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room_version" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room_version" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room_version" }

media3-exoplayer = {module = "androidx.media3:media3-exoplayer",version = "1.5.1"}
media3-ui ={ module ="androidx.media3:media3-ui",version = "1.5.1"}

# -------------------- Firebase --------------------
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics", version.ref = "firebaseCrashlytics" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-auth-ktx = { group = "com.google.firebase", name = "firebase-auth-ktx", version.ref = "firebaseAuthKtx" }

# =================================================================================
# TESTING
# =================================================================================
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }


[plugins]

# =================================================================================
# GRADLE PLUGINS
# =================================================================================
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinCompos" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
#google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
#firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlytics" }
hilt-ksp = { id = "com.google.devtools.ksp", version.ref = "hiltKsp" }
room={ id = "androidx.room", version.ref = "room_version"}